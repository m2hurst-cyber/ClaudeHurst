key: bill
name: BILL
vendor: BILL
category: accounting
auth: oauth2
docs: https://developer.bill.com/docs
blurb: >-
  Accounts payable and receivable between the ledger and the bank. Where approvals actually happen.
actions:
  - key: bill.open:bill
    label: Open a bill
    domain: finance
  - key: bill.code:bill
    label: Code a bill
    domain: finance
  - key: bill.route:for_approval
    label: Route for approval
    domain: finance
  - key: bill.approve:bill
    label: Approve a bill
    domain: finance
  - key: bill.schedule:payment
    label: Schedule a payment
    domain: finance
  - key: bill.sync:to_ledger
    label: Sync to the ledger
    domain: finance
records:
  - vendor
  - bill
  - approval
  - payment
# Recorded as steps only. These never leave the system of record:
never:
  - vendor bank details
  - invoice images
  - approver comments

# What has to be registered before this can be connected, and where.
per_tenant: false
registration: >-
  A developer key from BILL, plus per-organisation credentials.
portal: https://developer.bill.com/docs
credentials:
  - env: BILL_DEV_KEY
    what: the developer key
  - env: BILL_CLIENT_ID
    what: the app's client id
  - env: BILL_CLIENT_SECRET
    what: its secret
