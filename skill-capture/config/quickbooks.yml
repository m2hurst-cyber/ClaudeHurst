# QuickBooks Online: the four values that have to match Intuit's published API.
#
# UNVERIFIED. developer.intuit.com is not reachable from the build container, so these
# were not read off Intuit's documentation. They are kept here, alone, so that the one
# part of the connector that could be wrong is a config file somebody checks in a minute
# rather than constants buried through the code. Everything else — the OAuth dance, token
# rotation, the CDC mapping, the webhook signature — is independent of these strings.
#
# Confirm against:
#   https://developer.intuit.com/app/developer/qbo/docs/develop/authentication-and-authorization/oauth-2.0
#   https://developer.intuit.com/app/developer/qbo/docs/learn/explore-the-quickbooks-online-api/change-data-capture
#
# A wrong value here fails loudly at connect time with the provider's own error, not
# quietly in a way that would corrupt anything.
verified: false

authorize_url: https://appcenter.intuit.com/connect/oauth2
token_url: https://oauth.platform.intuit.com/oauth2/v1/tokens/bearer
revoke_url: https://developer.api.intuit.com/v2/oauth2/tokens/revoke
scope: com.intuit.quickbooks.accounting

api_base:
  production: https://quickbooks.api.intuit.com
  sandbox: https://sandbox-quickbooks.api.intuit.com

# Minor version pins the response shape. Raise it deliberately, not by drifting.
minor_version: 75

# CDC is a poll: "what changed since". The window and page size are Intuit's limits.
cdc:
  path: /v3/company/%<realm>s/cdc
  max_lookback_days: 30
  max_objects: 1000
  entities: [Invoice, Payment, Bill, BillPayment, JournalEntry, Purchase, Deposit, Customer, Vendor]
