default: &default
  capture_sweep:
    class: CaptureSweepJob
    queue: default
    schedule: every hour at minute 23
  quickbooks_sync:
    class: QuickbooksSyncJob
    queue: default
    schedule: every hour at minute 41
  provenance_anchor:
    class: ProvenanceAnchorJob
    queue: default
    schedule: every day at 3:07am
  rest_stop_sweep:
    class: RestStopSweepJob
    queue: default
    schedule: every day at 2:41am

development:
  <<: *default

production:
  <<: *default
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
