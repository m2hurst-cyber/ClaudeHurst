# Deploying Skill Capture to Render, without a terminal.
#
#   1. Push this repository to GitHub.
#   2. Render → New → Blueprint → pick the repository, then set BOTH of these:
#        Branch:         claude/skill-capture-institutional-memory-b7ksev
#        Blueprint Path: skill-capture/render.yaml
#      Skill Capture is not at the root of this repository — another application is — so
#      the path matters, and rootDir below keeps the build inside this directory.
#   3. Render reads this file, builds the image, creates the database, and gives the
#      service an HTTPS address of its own. Nothing to install on your machine.
#   4. Set SKILL_CAPTURE_BOOTSTRAP_ADMIN to your email address in the dashboard and
#      deploy. The first administrator is created on boot and the password is printed
#      into the deploy log, once. Sign in, change it, then clear the variable.
#      Nothing is ever seeded with a login, which is why this step exists at all.
#
# The keys below are generated once by Render and kept. Losing them loses whatever they
# encrypted — tokens and return documents — so copy them somewhere safe.
services:
  - type: web
    name: skill-capture
    runtime: docker
    rootDir: skill-capture   # this app is a subdirectory; build from here, not the repo root
    plan: starter            # free will work for a demo; starter keeps it awake
    healthCheckPath: /up
    autoDeployTrigger: commit
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase: { name: skill-capture-db, property: connectionString }
      - key: SECRET_KEY_BASE
        generateValue: true
      # Encrypt-at-rest keys. Generated once; keep a copy.
      - key: SKILL_CAPTURE_ENCRYPTION_PRIMARY_KEY
        generateValue: true
      - key: SKILL_CAPTURE_ENCRYPTION_DETERMINISTIC_KEY
        generateValue: true
      - key: SKILL_CAPTURE_ENCRYPTION_KEY_DERIVATION_SALT
        generateValue: true
      # The address Office will fetch the add-in from. Render fills this in itself.
      - key: SKILL_CAPTURE_PUBLIC_URL
        fromService: { type: web, name: skill-capture, property: host }
      # A fixed id for this installation's add-in, so updates replace it rather than
      # arriving beside it. Change it if you run a second instance on one tenant.
      - key: SKILL_CAPTURE_ADDIN_ID
        value: 6f0c2a52-7d1e-4c0b-9a8e-3b5f0d9c1e47
      # Drafting and judging run on rules until a key is set. Add it in the dashboard.
      # Your email address, to create the first administrator on the next deploy. The
      # password goes into the deploy log, once. Clear this afterwards; it is inert as
      # soon as anybody has an account, but there is no reason to leave it set.
      - key: SKILL_CAPTURE_BOOTSTRAP_ADMIN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Password resets need these four. Add them when you have a mail provider.
      - key: SMTP_ADDRESS
        sync: false
      - key: SMTP_USER_NAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

  # The background worker: sweeps for repeated work, writes the daily provenance anchor,
  # runs the flows. The console works without it; nothing is ever detected.
  - type: worker
    name: skill-capture-jobs
    runtime: docker
    rootDir: skill-capture
    plan: starter
    dockerCommand: ./bin/jobs
    autoDeployTrigger: commit
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: DATABASE_URL
        fromDatabase: { name: skill-capture-db, property: connectionString }
      - key: SECRET_KEY_BASE
        fromService: { type: web, name: skill-capture, envVarKey: SECRET_KEY_BASE }
      - key: SKILL_CAPTURE_ENCRYPTION_PRIMARY_KEY
        fromService: { type: web, name: skill-capture, envVarKey: SKILL_CAPTURE_ENCRYPTION_PRIMARY_KEY }
      - key: SKILL_CAPTURE_ENCRYPTION_DETERMINISTIC_KEY
        fromService: { type: web, name: skill-capture, envVarKey: SKILL_CAPTURE_ENCRYPTION_DETERMINISTIC_KEY }
      - key: SKILL_CAPTURE_ENCRYPTION_KEY_DERIVATION_SALT
        fromService: { type: web, name: skill-capture, envVarKey: SKILL_CAPTURE_ENCRYPTION_KEY_DERIVATION_SALT }
      - key: SKILL_CAPTURE_PUBLIC_URL
        fromService: { type: web, name: skill-capture, property: host }
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: skill-capture-db
    plan: basic-256mb
    postgresMajorVersion: "16"
