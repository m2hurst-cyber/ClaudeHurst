# FactSet worksheet skills, generated by script/worksheet_packs.py from one spec shared with the other provider (command keys are shared,
# syntax comes from commands.yml). Routes: financial analysis, macro, intrinsic and relative valuation, ESG.
key: factset-analysis
version: 1
kind: pack
provider: factset
title: FactSet worksheets
area: factset
stage: local
description: Skills that build Excel worksheets with FactSet formulas for financial analysis, macro analysis, valuation (intrinsic and relative)
  and ESG, then chart and sensitivity-test them. The FactSet command library holds every formula they use.
disclaimer: Formulas use FactSet syntax and field codes from the command library; a command marked unverified hasn't been checked against FactSet
  documentation in your terminal yet. Check units and periods before relying on a sheet.
fields:
- path: investment-analysis
  name: Investment analysis
  keywords:
  - equity research
  - analysis
  - valuation
  - investment
- path: investment-analysis/financial-analysis
  name: Financial analysis
  keywords:
  - financial statements
  - ratios
  - margin
  - income statement
- path: investment-analysis/macro-analysis
  name: Macro analysis
  keywords:
  - macro
  - gdp
  - inflation
  - rates
  - economic
- path: investment-analysis/valuation
  name: Valuation
  keywords:
  - valuation
  - fair value
- path: investment-analysis/valuation/intrinsic-valuation
  name: Intrinsic valuation
  keywords:
  - dcf
  - discounted cash flow
  - wacc
- path: investment-analysis/valuation/relative-valuation
  name: Relative valuation
  keywords:
  - comps
  - multiples
  - peers
  - ev/ebitda
- path: investment-analysis/esg
  name: ESG
  keywords:
  - esg
  - environmental
  - social
  - governance
  - sustainability
- path: investment-analysis/charting
  name: Charting
  keywords:
  - chart
  - graph
- path: investment-analysis/sensitivity-testing
  name: Sensitivity testing
  keywords:
  - sensitivity
  - scenario
  - what-if
routes:
  financial-analysis:
    title: Financial analysis
    steps:
    - name: factset-financial-statements
      title: Build a five-year financial statements sheet (FactSet)
      description: Builds a worksheet of five fiscal years of income statement, balance sheet and cash flow lines for one security, as live FactSet
        formulas. Use when starting a company's financial analysis.
      fields:
      - investment-analysis/financial-analysis
      steps:
      - - excel
        - Enter the security
      - - excel
        - Build the Financials sheet from the add-in
      - - excel
        - Check the latest year against the filing
      notes:
      - Figures are in the provider's reporting currency and units (usually millions); say so in the row header.
      - Compare FY0 revenue and net income with the latest annual report before relying on the sheet.
      worksheet:
        kind: table
        sheet: Financials
        title: Financial statements (5 years)
        row_header: Millions
        inputs:
        - key: security
          label: Security
          default: AAPL-US
        columns:
        - label: FY-4
          params:
            fpo: -4
        - label: FY-3
          params:
            fpo: -3
        - label: FY-2
          params:
            fpo: -2
        - label: FY-1
          params:
            fpo: -1
        - label: FY0
          params:
            fpo: 0
        rows:
        - key: revenue
          label: Revenue
          command: revenue
          format: '#,##0'
        - key: gross_profit
          label: Gross profit
          command: gross_profit
          format: '#,##0'
        - key: ebitda
          label: EBITDA
          command: ebitda
          format: '#,##0'
        - key: operating_income
          label: Operating income
          command: operating_income
          format: '#,##0'
        - key: net_income
          label: Net income
          command: net_income
          format: '#,##0'
        - key: eps_diluted
          label: Diluted EPS
          command: eps_diluted
          format: '0.00'
        - key: total_assets
          label: Total assets
          command: total_assets
          format: '#,##0'
        - key: total_debt
          label: Total debt
          command: total_debt
          format: '#,##0'
        - key: cash
          label: Cash and equivalents
          command: cash
          format: '#,##0'
        - key: total_equity
          label: Total equity
          command: total_equity
          format: '#,##0'
        - key: operating_cash_flow
          label: Cash from operations
          command: operating_cash_flow
          format: '#,##0'
        - key: capex
          label: Capital expenditure
          command: capex
          format: '#,##0'
        - key: free_cash_flow
          label: Free cash flow
          command: free_cash_flow
          format: '#,##0'
    - name: factset-financial-ratios
      title: Compute financial ratios (FactSet)
      description: Builds a ratios worksheet (growth, margins, return on equity, leverage, cash conversion) from the financial statements sheet.
        Use after building the five-year financial statements.
      fields:
      - investment-analysis/financial-analysis
      steps:
      - - excel
        - Build the Ratios sheet from the add-in
      - - excel
        - Review margins and leverage trends
      notes:
      - Ratios read the Financials sheet, so build that first and keep its layout.
      - Blank cells mean a missing input year, not zero.
      worksheet:
        kind: table
        sheet: Ratios
        title: Financial ratios
        source: factset-financial-statements
        columns:
        - label: FY-4
          params:
            fpo: -4
        - label: FY-3
          params:
            fpo: -3
        - label: FY-2
          params:
            fpo: -2
        - label: FY-1
          params:
            fpo: -1
        - label: FY0
          params:
            fpo: 0
        rows:
        - key: revenue_growth
          label: Revenue growth
          formula: =IFERROR({src_row:revenue}/{src_prev:revenue}-1,"")
          format: 0.0%
        - key: gross_margin
          label: Gross margin
          formula: =IFERROR({src_row:gross_profit}/{src_row:revenue},"")
          format: 0.0%
        - key: ebitda_margin
          label: EBITDA margin
          formula: =IFERROR({src_row:ebitda}/{src_row:revenue},"")
          format: 0.0%
        - key: net_margin
          label: Net margin
          formula: =IFERROR({src_row:net_income}/{src_row:revenue},"")
          format: 0.0%
        - key: roe
          label: Return on equity
          formula: =IFERROR({src_row:net_income}/{src_row:total_equity},"")
          format: 0.0%
        - key: debt_to_equity
          label: Debt / equity
          formula: =IFERROR({src_row:total_debt}/{src_row:total_equity},"")
          format: 0.00x
        - key: net_debt_to_ebitda
          label: Net debt / EBITDA
          formula: =IFERROR(({src_row:total_debt}-{src_row:cash})/{src_row:ebitda},"")
          format: 0.00x
        - key: fcf_conversion
          label: FCF conversion (FCF / net income)
          formula: =IFERROR({src_row:free_cash_flow}/{src_row:net_income},"")
          format: 0.0%
    - name: factset-chart-financial-trends
      title: Chart financial trends (FactSet)
      description: Charts revenue, EBITDA and net income across five years on the financial statements sheet. Use when the financial analysis
        needs a trend chart for a deck or memo.
      fields:
      - investment-analysis/financial-analysis
      - investment-analysis/charting
      steps:
      - - excel
        - Add the trend chart from the add-in
      - - excel
        - Format and copy the chart
      notes:
      - Uses the Financials sheet; rebuild the chart after rebuilding that sheet.
      worksheet:
        kind: chart
        source: factset-financial-statements
        chart: ColumnClustered
        title: Revenue, EBITDA and net income
        series:
        - revenue
        - ebitda
        - net_income
  macro-analysis:
    title: Macro analysis
    steps:
    - name: factset-macro-dashboard
      title: Build a macro dashboard (FactSet)
      description: Builds a worksheet of economic indicators (growth, inflation, unemployment, policy rate, Treasury yields) with the latest value
        and the value a year ago. Use when starting a macro analysis.
      fields:
      - investment-analysis/macro-analysis
      steps:
      - - excel
        - Choose the series
      - - excel
        - Build the Macro sheet from the add-in
      - - excel
        - Note the release date of each series
      notes:
      - Economic series are released with a lag and get revised; note the as-of date.
      - One series per row; replace the default list with the series your analysis needs.
      worksheet:
        kind: grid
        sheet: Macro
        title: Macro dashboard
        stats: []
        inputs:
        - key: series
          label: Series
          type: list
          default: ''
        - key: econ_code
          label: FactSet code for the latest value
          default: ''
        - key: econ_code_ago
          label: FactSet code for the value a year ago
          default: ''
        columns:
        - key: latest
          label: Latest
          command: macro_value
          format: '0.00'
        - key: year_ago
          label: A year ago
          command: macro_value_ago
          format: '0.00'
    - name: factset-chart-macro-indicators
      title: Chart macro indicators (FactSet)
      description: Charts each macro indicator's latest value against a year ago. Use when the macro analysis needs a summary chart.
      fields:
      - investment-analysis/macro-analysis
      - investment-analysis/charting
      steps:
      - - excel
        - Add the macro chart from the add-in
      - - excel
        - Copy the chart into the memo or deck
      notes:
      - Indicators have different units; chart like with like, or split the chart.
      worksheet:
        kind: chart
        source: factset-macro-dashboard
        chart: ColumnClustered
        title: 'Macro indicators: latest vs a year ago'
        series:
        - latest
        - year_ago
  valuation-intrinsic:
    title: 'Valuation: intrinsic'
    steps:
    - name: factset-dcf-valuation
      title: Build a DCF valuation (FactSet)
      description: Builds a five-year discounted cash flow worksheet from consensus free cash flow, with WACC and terminal growth inputs, a Gordon-growth
        terminal value, and value per share against the current price. Use for an intrinsic valuation of one security.
      fields:
      - investment-analysis/valuation/intrinsic-valuation
      steps:
      - - excel
        - Enter the security, WACC and terminal growth
      - - excel
        - Build the DCF sheet from the add-in
      - - excel
        - Check units and the share count
      notes:
      - Consensus free cash flow, net debt and shares must be in the same units (usually millions).
      - Terminal growth must be below WACC; keep it near long-run nominal GDP growth.
      - Replace consensus with your own forecast where you have one.
      worksheet:
        kind: table
        sheet: DCF
        title: Discounted cash flow valuation
        row_header: Millions
        inputs:
        - key: security
          label: Security
          default: AAPL-US
        - key: wacc
          label: WACC
          default: 0.09
          format: 0.0%
        - key: terminal_growth
          label: Terminal growth
          default: 0.025
          format: 0.0%
        columns:
        - label: FY+1
          params:
            fpo: 1
            n: 1
        - label: FY+2
          params:
            fpo: 2
            n: 2
        - label: FY+3
          params:
            fpo: 3
            n: 3
        - label: FY+4
          params:
            fpo: 4
            n: 4
        - label: FY+5
          params:
            fpo: 5
            n: 5
        rows:
        - key: revenue
          label: Revenue (consensus)
          command: revenue_est
          format: '#,##0'
        - key: ebitda
          label: EBITDA (consensus)
          command: ebitda_est
          format: '#,##0'
        - key: fcf
          label: Free cash flow (consensus)
          command: fcf_est
          format: '#,##0'
        - key: discount_factor
          label: Discount factor
          formula: =1/(1+{input:wacc})^{col:n}
          format: '0.000'
        - key: pv_fcf
          label: PV of free cash flow
          formula: ={row:fcf}*{row:discount_factor}
          format: '#,##0'
        summary:
        - key: sum_pv
          label: Sum of PV of FCF
          formula: ={row_sum:pv_fcf}
          format: '#,##0'
        - key: terminal_value
          label: Terminal value
          formula: ={row_last:fcf}*(1+{input:terminal_growth})/({input:wacc}-{input:terminal_growth})
          format: '#,##0'
        - key: pv_terminal
          label: PV of terminal value
          formula: ={cell:terminal_value}*{row_last:discount_factor}
          format: '#,##0'
        - key: enterprise_value
          label: Enterprise value
          formula: ={cell:sum_pv}+{cell:pv_terminal}
          format: '#,##0'
          bold: true
        - key: net_debt
          label: Net debt
          command: net_debt
          format: '#,##0'
        - key: equity_value
          label: Equity value
          formula: ={cell:enterprise_value}-{cell:net_debt}
          format: '#,##0'
        - key: shares
          label: Shares outstanding
          command: shares_out
          format: '#,##0'
        - key: value_per_share
          label: Value per share
          formula: ={cell:equity_value}/{cell:shares}
          format: '0.00'
          bold: true
        - key: price
          label: Current price
          command: price
          format: '0.00'
        - key: upside
          label: Upside / (downside)
          formula: ={cell:value_per_share}/{cell:price}-1
          format: 0.0%
          bold: true
    - name: factset-dcf-sensitivity
      title: Sensitivity-test the DCF (FactSet)
      description: Builds a two-way sensitivity grid of value per share across WACC and terminal growth, reading the DCF sheet. Use after building
        the DCF valuation.
      fields:
      - investment-analysis/valuation/intrinsic-valuation
      - investment-analysis/sensitivity-testing
      steps:
      - - excel
        - Build the sensitivity grid from the add-in
      - - excel
        - Highlight the base case
      notes:
      - Reads the DCF sheet's free cash flow, net debt and share count; rebuild after changing the DCF.
      worksheet:
        kind: sensitivity
        sheet: DCF sensitivity
        title: 'Value per share: WACC x terminal growth'
        source: factset-dcf-valuation
        row_param:
          label: WACC
          values:
          - 0.07
          - 0.08
          - 0.09
          - 0.1
          - 0.11
          format: 0.0%
        col_param:
          label: Terminal growth
          values:
          - 0.015
          - 0.02
          - 0.025
          - 0.03
          - 0.035
          format: 0.0%
        formula: =(NPV({row},{src_row_range:fcf})+{src_row_last:fcf}*(1+{col})/({row}-{col})/(1+{row})^{src_count}-{src_cell:net_debt})/{src_cell:shares}
        format: '0.00'
  valuation-relative:
    title: 'Valuation: relative'
    steps:
    - name: factset-peer-comparables
      title: Build a peer comparables sheet (FactSet)
      description: Builds a relative valuation worksheet of price, market cap and multiples (EV/EBITDA, P/E, P/B, P/S) with ROE and net margin
        for a list of peers, plus the median and mean. Use for a relative valuation.
      fields:
      - investment-analysis/valuation/relative-valuation
      steps:
      - - excel
        - List the peers
      - - excel
        - Build the Comps sheet from the add-in
      - - excel
        - Exclude outliers from the median
      notes:
      - Peers should share business model, size and region; say why each is in.
      - Negative earnings make P/E meaningless; leave it blank rather than zero.
      worksheet:
        kind: grid
        sheet: Comps
        title: Peer comparables
        inputs:
        - key: peers
          label: Security
          type: list
          default: 'AAPL-US

            MSFT-US

            GOOGL-US

            AMZN-US

            META-US'
        columns:
        - key: price
          label: Price
          command: price
          format: '0.00'
        - key: market_cap
          label: Market cap
          command: market_cap
          format: '#,##0'
        - key: ev_ebitda
          label: EV / EBITDA
          command: ev_ebitda
          format: 0.0x
        - key: pe_ratio
          label: P / E
          command: pe_ratio
          format: 0.0x
        - key: price_to_book
          label: P / B
          command: price_to_book
          format: 0.0x
        - key: price_to_sales
          label: P / S
          command: price_to_sales
          format: 0.0x
        - key: roe
          label: ROE
          command: roe
          format: '0.0'
        - key: net_margin
          label: Net margin
          command: net_margin
          format: '0.0'
    - name: factset-chart-peer-multiples
      title: Chart peer multiples (FactSet)
      description: Charts P/E and EV/EBITDA for each peer on the comparables sheet. Use when the relative valuation needs a chart.
      fields:
      - investment-analysis/valuation/relative-valuation
      - investment-analysis/charting
      steps:
      - - excel
        - Add the multiples chart from the add-in
      - - excel
        - Copy the chart into the memo or deck
      notes:
      - Uses the Comps sheet.
      worksheet:
        kind: chart
        source: factset-peer-comparables
        chart: ColumnClustered
        title: P/E and EV/EBITDA by peer
        series:
        - pe_ratio
        - ev_ebitda
  esg:
    title: ESG
    steps:
    - name: factset-esg-scorecard
      title: Build an ESG scorecard (FactSet)
      description: Builds a worksheet of ESG scores for a company and its peers, with the median and mean. Use when an analysis needs an ESG comparison.
      fields:
      - investment-analysis/esg
      steps:
      - - excel
        - List the companies
      - - excel
        - Build the ESG sheet from the add-in
      - - excel
        - Note the score provider and date
      notes:
      - Scores from different providers aren't comparable; use one provider per sheet.
      - Disclosure scores measure reporting, not performance.
      worksheet:
        kind: grid
        sheet: ESG
        title: ESG scorecard
        inputs:
        - key: peers
          label: Security
          type: list
          default: 'AAPL-US

            MSFT-US

            GOOGL-US

            AMZN-US

            META-US'
        - key: esg_code
          label: FactSet ESG score code
          default: ''
        columns:
        - key: esg_score
          label: ESG
          command: esg_score
          format: '0.0'
    - name: factset-chart-esg-scores
      title: Chart ESG scores (FactSet)
      description: Charts the ESG scores of each company on the ESG scorecard. Use when the ESG comparison needs a chart.
      fields:
      - investment-analysis/esg
      - investment-analysis/charting
      steps:
      - - excel
        - Add the ESG chart from the add-in
      - - excel
        - Copy the chart into the memo or deck
      notes:
      - Uses the ESG sheet.
      worksheet:
        kind: chart
        source: factset-esg-scorecard
        chart: BarClustered
        title: ESG scores by company
        series:
        - esg_score
