# FactSet command library: each formula with its syntax ({param} placeholders), defaults and category.
# Starter catalog: every command installs as unverified until someone with FactSet access checks it (console: Formulas).
# Add the rest by editing this file or importing a CSV in the console.
provider: factset
commands:
  revenue:
    name: Revenue
    category: Income statement
    syntax: =FDS({security},"FF_SALES({period},{fpo})")
    defaults:
      period: ANN
      fpo: 0
    description: 'Revenue (period: ANN annual, QTR quarterly; fpo: 0 latest, -1 prior, ...).'
