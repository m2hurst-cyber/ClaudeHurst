    category: Estimates
    syntax: =BQL({security},"net_income(fpt={fpt}, fpo={fpo}, ae=E)")
    defaults:
      fpt: A
      fpo: 1
    description: Net income, consensus for a forward fiscal period (fpo 1 = next).
