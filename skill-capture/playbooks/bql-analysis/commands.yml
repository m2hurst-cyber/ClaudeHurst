    category: Macro
    syntax: =BQL({security},"px_last")
    description: Latest value of an economic index ticker (for example GDP CQOQ Index).
  macro_value_ago:
    name: Macro series, value a period ago
    category: Macro
    syntax: =BQL({security},"px_last(dates={ago})")
    defaults:
      ago: -1Y
    description: Value of the series at a past date (dates=-1Y).
  index_members:
    name: Index members
    category: Universe
    syntax: =BQL.Query("get(name) for(members('{index}'))")
    defaults:
      index: SPX Index
    description: Lists an index's members (spills down).
  price_history:
    name: Price history
    category: Market
    syntax: =BQL({security},"px_last(dates=range({start},0D))")
    defaults:
      start: -1Y
    description: Daily closing prices over a range (spills down).
  total_return_1y:
    name: Total return, 1 year
    category: Market
    syntax: =BQL({security},"total_return(calc_interval=1Y)")
    description: One-year total return.
