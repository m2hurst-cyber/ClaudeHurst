    category: Market
    syntax: =BQL({security},"low_52week")
    description: 52-week low, latest.
  revenue_est:
    name: Revenue, consensus
    category: Estimates
    syntax: =BQL({security},"sales_rev_turn(fpt={fpt}, fpo={fpo}, ae=E)")
    defaults:
      fpt: A
      fpo: 1
    description: Revenue, consensus for a forward fiscal period (fpo 1 = next).
  ebitda_est:
    name: EBITDA, consensus
    category: Estimates
    syntax: =BQL({security},"ebitda(fpt={fpt}, fpo={fpo}, ae=E)")
    defaults:
      fpt: A
      fpo: 1
    description: EBITDA, consensus for a forward fiscal period (fpo 1 = next).
  eps_est:
    name: EPS, consensus
    category: Estimates
    syntax: =BQL({security},"is_eps(fpt={fpt}, fpo={fpo}, ae=E)")
    defaults:
      fpt: A
      fpo: 1
    description: EPS, consensus for a forward fiscal period (fpo 1 = next).
