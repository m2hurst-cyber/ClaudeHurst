# Bloomberg BQL command library: each formula with its syntax ({param} placeholders), defaults and category.
# Starter catalog: every command installs as unverified until someone with BQL access checks it (console: Formulas).
# Add the rest by editing this file or importing a CSV in the console.
provider: bql
commands:
  revenue:
    name: Revenue
    category: Income statement
    syntax: =BQL({security},"sales_rev_turn(fpt={fpt}, fpo={fpo})")
    defaults:
      fpt: A
      fpo: 0
    description: 'Revenue for the fiscal period (fpt: A annual, Q quarterly; fpo: 0 latest, -1 prior, ...).'
  gross_profit:
    name: Gross profit
    category: Income statement
    syntax: =BQL({security},"gross_profit(fpt={fpt}, fpo={fpo})")
